services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: showup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-showup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-showup}
      POSTGRES_DB: ${DB_NAME:-showup}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - showup-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-showup} -d ${DB_NAME:-showup}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: showup-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - showup-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  showup-pgdata:
  showup-redisdata:
