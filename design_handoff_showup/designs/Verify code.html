<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Show Up — Verify code</title>

<link rel="stylesheet" href="colors_and_type.css">

<style>
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--liq-font-sans);
    background:
      radial-gradient(80% 60% at 20% 10%, rgba(254,104,57,0.10), transparent 70%),
      radial-gradient(70% 60% at 90% 90%, rgba(129,42,236,0.10), transparent 70%),
      #F0EEE9;
    color: var(--liq-fg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior: none;
  }

  /* su-app reset (mirrors ui_kits/show-up/index.html so shared.jsx renders right) */
  .su-app {
    background: var(--liq-bg);
    color: var(--liq-fg);
    font-family: var(--liq-font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .su-app * { box-sizing: border-box; }
  .su-app button {
    font-family: inherit;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    color: inherit;
  }
  .su-noscroll::-webkit-scrollbar { display: none; }
  .su-noscroll { scrollbar-width: none; }

  /* Page chrome */
  .stage {
    min-height: 100vh;
    padding: 56px 24px 80px;
    display: flex; flex-direction: column; align-items: center;
    gap: 36px;
  }
  .page-head { max-width: 880px; text-align: center; }
  .page-head .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--liq-font-sans); font-weight: 700;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--liq-primary-500);
    padding: 6px 12px; border-radius: 9999px;
    background: rgba(167,139,250,0.16);
  }
  .page-head .kicker .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--liq-orange-500); }
  .page-head h1 {
    font-family: var(--liq-font-serif); font-weight: 700;
    font-size: 40px; line-height: 1.08; letter-spacing: -0.02em;
    color: var(--liq-fg); margin: 14px 0 8px;
  }
  .page-head p {
    font-family: var(--liq-font-sans); font-weight: 500; font-size: 16px;
    line-height: 1.5; color: var(--liq-neutral-200); max-width: 620px;
    margin: 0 auto;
  }

  .row {
    display: flex; gap: 32px; align-items: flex-start;
    flex-wrap: wrap; justify-content: center;
  }
  .frame {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .frame-label {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--liq-font-sans); font-weight: 700; font-size: 12px;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--liq-fg-muted);
  }
  .frame-label .pip { width: 7px; height: 7px; border-radius: 50%; }
  .frame-label .pip.ok   { background: #00AB55; box-shadow: 0 0 0 3px rgba(0,171,85,0.18); }
  .frame-label .pip.err  { background: var(--liq-danger); box-shadow: 0 0 0 3px rgba(251,50,59,0.18); }
  .frame-shell {
    border-radius: 48px;
    padding: 10px;
    background: linear-gradient(165deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5));
    box-shadow:
      0 30px 80px rgba(46, 1, 71, 0.16),
      0 8px 24px rgba(46, 1, 71, 0.08),
      0 0 0 1px rgba(29,17,41,0.06);
  }
  .frame-shell > .su-app {
    border-radius: 38px;
    overflow: hidden;
  }

  /* Animations */
  @keyframes su-shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }
  @keyframes caret-blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* Caption row below frames */
  .caption {
    max-width: 360px; text-align: center;
    font-family: var(--liq-font-sans); font-size: 13px; line-height: 1.5;
    color: var(--liq-fg-muted); font-weight: 500;
  }
  .caption strong { color: var(--liq-fg); font-weight: 700; }

  .notes {
    margin-top: 24px;
    max-width: 720px;
    padding: 22px 26px;
    border-radius: 20px;
    background: rgba(255,255,255,0.66);
    border: 1px solid rgba(29,17,41,0.08);
    backdrop-filter: blur(8px);
  }
  .notes h3 {
    font-family: var(--liq-font-serif); font-weight: 700; font-size: 18px;
    margin: 0 0 12px; color: var(--liq-fg);
  }
  .notes ul {
    margin: 0; padding-left: 18px; display: grid; gap: 8px;
    font-family: var(--liq-font-sans); font-size: 13.5px; line-height: 1.5;
    color: var(--liq-neutral-200);
  }
  .notes li strong { color: var(--liq-fg); font-weight: 700; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Shared primitives (StatusBar, AppHeader, Icon, Button, Eyebrow, HomeIndicator) -->
<script type="text/babel" src="ui_kits/show-up/shared.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ─────────────────────────────────────────────────────────────
// iOS-style numeric pad — same look as ScreenPhoneNumber so the
// verification step reads as a continuation of the previous screen.
// ─────────────────────────────────────────────────────────────
function NumericKeypad({ onKey, onBackspace }) {
  const KEYS = [
    { d: '1', s: '' },
    { d: '2', s: 'A B C' },
    { d: '3', s: 'D E F' },
    { d: '4', s: 'G H I' },
    { d: '5', s: 'J K L' },
    { d: '6', s: 'M N O' },
    { d: '7', s: 'P Q R S' },
    { d: '8', s: 'T U V' },
    { d: '9', s: 'W X Y Z' },
    null,
    { d: '0', s: '+' },
    'back',
  ];
  const Key = ({ d, s }) => (
    <button onClick={() => onKey && onKey(d)} style={{
      flex: 1, height: '100%', borderRadius: 6, background: '#FFFFFF',
      boxShadow: '0 1px 0 rgba(29,17,41,0.18)',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      padding: '4px 0', transition: 'background 120ms',
    }}
      onMouseDown={e => e.currentTarget.style.background = '#E6E1DC'}
      onMouseUp={e => e.currentTarget.style.background = '#FFFFFF'}
      onMouseLeave={e => e.currentTarget.style.background = '#FFFFFF'}>
      <span style={{
        fontFamily: '-apple-system, "SF Pro Display", system-ui',
        fontWeight: 400, fontSize: 24, lineHeight: 1, color: 'var(--liq-fg)', letterSpacing: 0.4,
      }}>{d}</span>
      {s && <span style={{
        fontFamily: '-apple-system, "SF Pro Display", system-ui',
        fontWeight: 600, fontSize: 9, lineHeight: 1, color: 'var(--liq-fg-muted)',
        letterSpacing: 1.4, marginTop: 3,
      }}>{s}</span>}
    </button>
  );
  const Back = () => (
    <button onClick={onBackspace} style={{
      flex: 1, height: '100%', borderRadius: 6, background: 'transparent',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <svg width="26" height="20" viewBox="0 0 26 20" fill="none">
        <path d="M8.5 2H23a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8.5L1 10l7.5-8z"
          stroke="var(--liq-fg)" strokeWidth="1.4" strokeLinejoin="round" fill="none"/>
        <path d="M12 7l6 6M18 7l-6 6"
          stroke="var(--liq-fg)" strokeWidth="1.6" strokeLinecap="round"/>
      </svg>
    </button>
  );
  return (
    <div style={{
      background: '#D1CDC8',
      padding: '8px 3px 4px',
      display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)',
      gridAutoRows: 46, gap: 6,
    }}>
      {KEYS.map((k, i) => {
        if (k === null) return <div key={i}/>;
        if (k === 'back') return <Back key={i}/>;
        return <Key key={i} d={k.d} s={k.s}/>;
      })}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Code slot — one of four. Empty / active / filled / error.
// Active slot shows a violet caret + soft halo so the user knows
// where the next digit will land. Error tints the box softly
// rather than blasting a solid red — calm danger UX.
// ─────────────────────────────────────────────────────────────
function PhoneCodeSlot({ value, active, error }) {
  const borderColor = error
    ? 'var(--liq-danger)'
    : active
      ? 'var(--liq-primary-500)'
      : value
        ? 'rgba(29,17,41,0.32)'
        : 'var(--liq-border)';
  const halo = error
    ? '0 0 0 4px rgba(251,50,59,0.10)'
    : active
      ? '0 0 0 4px rgba(129,42,236,0.10)'
      : '0 1px 2px rgba(46,1,71,0.04)';
  return (
    <div style={{
      width: 49, height: 62, borderRadius: 14, flex: 'none',
      background: error ? 'rgba(251,50,59,0.04)' : '#FFFFFF',
      border: `1.5px solid ${borderColor}`,
      boxShadow: halo,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: 'var(--liq-font-serif)', fontWeight: 700, fontSize: 30,
      color: error ? '#7A1F26' : 'var(--liq-fg)',
      transition: 'border-color 180ms cubic-bezier(.22,1,.36,1), box-shadow 180ms, background 180ms',
      fontVariantNumeric: 'tabular-nums',
    }}>
      {value || (active && !error
        ? <span style={{
            display: 'inline-block', width: 2, height: 26,
            background: 'var(--liq-primary-500)',
            animation: 'caret-blink 1s steps(2, end) infinite',
          }}/>
        : null
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Verify code screen — `error` toggles the failure state.
// ─────────────────────────────────────────────────────────────
function ScreenVerifyCode({ error = false, phone = '+49 176 123 45 678' }) {
  // Default state: empty slots, first one active (caret).
  // Error state:   the digits the user just submitted are preserved, so they
  //                can correct only what's wrong rather than re-type all four.
  const [digits, setDigits] = useState(error ? ['4', '8', '2', '1', '7', '0'] : ['', '', '', '', '', '']);
  const activeIdx = digits.findIndex(d => !d);
  const filled = digits.every(d => d);

  // Resend cooldown. In the error state we assume the previous send is old
  // enough that resend is immediately available (cooldown = 0). In the
  // default state we show a fresh 24s timer — the SMS was just sent.
  const [cooldown, setCooldown] = useState(error ? 0 : 24);
  useEffect(() => {
    if (cooldown <= 0) return;
    const t = setTimeout(() => setCooldown(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [cooldown]);

  // One-shot shake on the slot row when entering the error state.
  const [shakeKey, setShakeKey] = useState(0);
  useEffect(() => { if (error) setShakeKey(k => k + 1); }, [error]);

  const handleKey = (d) => {
    setDigits(prev => {
      const idx = prev.findIndex(x => !x);
      if (idx === -1) return prev;
      const next = [...prev]; next[idx] = d; return next;
    });
  };
  const handleBack = () => {
    setDigits(prev => {
      let idx = prev.length - 1;
      while (idx >= 0 && !prev[idx]) idx--;
      if (idx < 0) return prev;
      const next = [...prev]; next[idx] = ''; return next;
    });
  };

  return (
    <div className="su-app" style={{
      width: 390, height: 844, position: 'relative', overflow: 'hidden',
      background: 'var(--liq-bg)',
      display: 'flex', flexDirection: 'column',
    }}>
      {/* Ambient atmosphere — form tier (soft wash for the verification step) */}
      <Atmosphere variant="form"/>

      <div style={{ position: 'relative', zIndex: 2 }}>
        <StatusBar time="4:20"/>
        <AppHeader title="" leading="back"/>
      </div>

      <div className="su-noscroll" style={{
        flex: 1, position: 'relative', zIndex: 1, overflow: 'hidden',
        padding: '4px 24px 0', display: 'flex', flexDirection: 'column',
      }}>
        <Eyebrow color="orange">Phone verification</Eyebrow>

        <h1 className="su-underlined" style={{
          fontFamily: 'var(--liq-font-serif)', fontWeight: 700, fontSize: 38,
          letterSpacing: '-0.02em', lineHeight: 1.05, color: 'var(--liq-fg)',
          margin: '14px 0 10px', textWrap: 'balance',
        }}>
          Enter your <em>code</em>.
        </h1>

        <p style={{
          fontFamily: 'var(--liq-font-sans)', fontWeight: 500, fontSize: 15,
          lineHeight: 1.45, color: 'var(--liq-neutral-200)', margin: 0,
          textWrap: 'pretty', maxWidth: 320,
        }}>
          We just sent a 6-digit code to{' '}
          <span style={{ color: 'var(--liq-fg)', fontWeight: 700, whiteSpace: 'nowrap' }}>
            {phone}
          </span>.
        </p>

        {/* Code slots */}
        <div
          key={shakeKey}
          style={{
            marginTop: 26, display: 'flex', gap: 8, justifyContent: 'space-between',
            animation: error ? 'su-shake 480ms cubic-bezier(.36,.07,.19,.97) both' : undefined,
          }}
          aria-label="Enter your 6-digit verification code"
        >
          {digits.map((d, i) => (
            <PhoneCodeSlot key={i} value={d} active={!error && i === activeIdx} error={error}/>
          ))}
        </div>

        {/* Helper / error line — sits IMMEDIATELY under the inputs so the
            association is unambiguous. aria-live makes it discoverable to
            assistive tech without stealing focus. */}
        <div
          aria-live="polite"
          style={{ minHeight: 42, marginTop: 14, paddingLeft: 2 }}
        >
          {error ? (
            <div style={{
              display: 'flex', alignItems: 'flex-start', gap: 10,
              padding: '10px 14px',
              borderRadius: 12,
              background: 'rgba(251,50,59,0.07)',
              border: '1px solid rgba(251,50,59,0.18)',
            }}>
              {/* small alert glyph — drawn, not emoji */}
              <span style={{
                flex: 'none', width: 18, height: 18, borderRadius: '50%',
                background: 'var(--liq-danger)', color: '#fff',
                display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                fontFamily: 'var(--liq-font-serif)', fontWeight: 700, fontSize: 12,
                lineHeight: 1, marginTop: 1,
              }}>!</span>
              <div style={{
                fontFamily: 'var(--liq-font-sans)', fontSize: 13.5, lineHeight: 1.4,
                color: 'var(--liq-danger-fg)',
              }}>
                <span style={{ fontWeight: 500 }}>
                  Code doesn't match. Please check or request a new code.
                </span>
              </div>
            </div>
          ) : null}
        </div>

        {/* Primary CTA — disabled until the user has entered 6 digits.
            In the error state the digits are still filled, so the button is
            enabled and the user can try again immediately after editing the
            wrong digit. */}
        <div style={{ marginTop: 16 }}>
          <Button variant="sunset" size="lg" fullWidth disabled={!filled}>
            Verify code
          </Button>
        </div>

        {/* Secondary actions — stacked, each on its own line, so neither
            wraps awkwardly inside the 342px usable width of the phone.
            (1) Resend with cooldown — text → button at 0:00. Avoids the
                user spamming the SMS gateway.
            (2) Edit phone number — always available, sends them back
                one step.
            Both are text-styled rather than buttoned so the primary
            sunset CTA stays the only visual destination. */}
        <div style={{
          marginTop: 22, display: 'flex', flexDirection: 'column',
          alignItems: 'center', gap: 10,
        }}>
          <div style={{
            fontFamily: 'var(--liq-font-sans)', fontSize: 14, fontWeight: 500,
            color: 'var(--liq-fg-muted)', lineHeight: 1.3,
          }}>
            Didn't receive a code?
          </div>
          {cooldown > 0 ? (
            <span style={{
              fontFamily: 'var(--liq-font-sans)', fontSize: 14, fontWeight: 600,
              color: 'var(--liq-fg-subtle)',
              fontVariantNumeric: 'tabular-nums',
            }}>
              Send a new code in 0:{String(cooldown).padStart(2, '0')}
            </span>
          ) : (
            <button style={{
              fontFamily: 'var(--liq-font-sans)', fontSize: 14, fontWeight: 700,
              color: 'var(--liq-primary-500)',
              textDecoration: 'underline', textUnderlineOffset: 3,
              textDecorationThickness: 1.5,
              padding: '2px 4px',
            }}>
              Send a new code
            </button>
          )}

          <button style={{
            display: 'inline-flex', alignItems: 'center', gap: 7,
            fontFamily: 'var(--liq-font-sans)', fontSize: 14, fontWeight: 600,
            color: 'var(--liq-fg-muted)',
            padding: '4px 8px',
          }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" strokeWidth="1.8"
              strokeLinecap="round" strokeLinejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
              <path d="M15 5l4 4"/>
            </svg>
            Edit phone number
          </button>
        </div>

        <div style={{ flex: 1 }}/>
      </div>

      {/* Numeric keypad pinned bottom — above the home indicator */}
      <div style={{ position: 'relative', zIndex: 2 }}>
        <NumericKeypad onKey={handleKey} onBackspace={handleBack}/>
        <HomeIndicator/>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Page — both states side-by-side on a warm canvas.
// ─────────────────────────────────────────────────────────────
function Page() {
  return (
    <div className="stage">
      <div className="page-head">
        <span className="kicker">
          <span className="dot"></span>
          01 · Welcome &amp; sign-up · Phone verification
        </span>
        <h1>Enter your <em style={{ fontWeight: 500 }}>code</em>.</h1>
        <p>
          The screen after the user submits their phone number. Two states:
          the fresh code-entry view, and the inline failure response after
          a code mismatch.
        </p>
      </div>

      <div className="row">
        <div className="frame">
          <div className="frame-label">
            <span className="pip ok"></span>
            01 · Code entry · default
          </div>
          <div className="frame-shell">
            <ScreenVerifyCode/>
          </div>
          <div className="caption">
            First arrival. Caret on slot 1, SMS auto-fill hint, resend
            <strong> cooled down for 24s</strong> so a panicked user can't
            spam the gateway.
          </div>
        </div>

        <div className="frame">
          <div className="frame-label">
            <span className="pip err"></span>
            02 · Code entry · mismatch
          </div>
          <div className="frame-shell">
            <ScreenVerifyCode error={true}/>
          </div>
          <div className="caption">
            Inline failure response.
            <strong> Digits are preserved</strong> so the user can correct
            only the wrong one; cooldown is released; "send a new one" is
            embedded inside the error so the recovery path is one tap.
          </div>
        </div>
      </div>

      <div className="notes">
        <h3>Why this error treatment</h3>
        <ul>
          <li>
            <strong>Inline, not modal.</strong> The error is glued to the
            inputs that produced it. The original mockup floated a toast
            over the Verify button — that hides the recovery action and
            disconnects cause from effect.
          </li>
          <li>
            <strong>Digits stay put.</strong> Don't auto-clear — let the
            user fix one digit. Wiping the whole code on failure is a
            hostile pattern that punishes a near-miss.
          </li>
          <li>
            <strong>Brand-voice copy.</strong> "That code doesn't match"
            — informative, not cautionary (per the system's microcopy rule).
            No "Wrong", no "Failed", no "Error". The next step lives
            inside the sentence as a link.
          </li>
          <li>
            <strong>Calm danger.</strong> 1.5px danger border, a 4-px
            danger halo, a tinted 7%-alpha danger wash on the slot bg —
            never a solid red fill. The system's <code>--liq-danger-fg</code>
            is used for text so contrast on warm paper stays AA.
          </li>
          <li>
            <strong>One-shot shake</strong> on the slot row to confirm the
            attempt registered, then back to a still UI. No continuous
            attention-stealing animation.
          </li>
          <li>
            <strong>Cooldown released on failure.</strong> If the SMS was
            wrong (typed digit, stale code), the user shouldn't have to
            wait through a fresh 24s timer to try a different code.
          </li>
          <li>
            <strong>Always-available escape hatch.</strong> "Edit phone
            number" stays present in both states — wrong-number is a
            common cause of "I never got the code".
          </li>
          <li>
            <strong>aria-live="polite"</strong> on the helper region so
            screen readers announce the failure without yanking focus
            from the input the user is about to fix.
          </li>
        </ul>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Page/>);
</script>
</body>
</html>
