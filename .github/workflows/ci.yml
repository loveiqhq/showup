name: CI

# Runs on every pull request and every push to main, so a change that breaks the build, the linter or
# any test cannot reach main unnoticed (Epic 18). Before this existed, the tests only ran when someone
# remembered to type the command locally.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run, so CI is not queued behind stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, unit & e2e tests
    runs-on: ubuntu-latest

    # The e2e suite runs the real app against a real database and Redis, so both are started alongside
    # the job. Images match docker-compose.yml — PostGIS is required, not plain Postgres, because the
    # proximity search uses it.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: showup
          POSTGRES_PASSWORD: showup
          POSTGRES_DB: showup
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U showup -d showup"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    env:
      NODE_ENV: test
      # Only the database settings and the token secret are required by the env validation; everything
      # else falls back to a safe default. No real external service is contacted: push, email,
      # analytics and error monitoring all stay switched off, so CI needs no credentials of any kind.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: showup
      DB_PASSWORD: showup
      DB_NAME: showup
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-only-insecure-secret-not-used-anywhere-real
      # The e2e suite reads the one-time code from the API response, which only happens when this is on.
      AUTH_EXPOSE_OTP: 'true'
      ANALYTICS_SALT: ci-only-insecure-analytics-salt
      SWAGGER_ENABLED: 'false'

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if the two have drifted apart.
      - name: Install dependencies
        run: npm ci

      # The non-fixing linter: CI must report problems, never silently rewrite files.
      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      # Runs with coverage rather than a bare `npm test`, because the coverage thresholds in
      # package.json are only checked when coverage is collected. Without this the minimums would
      # be enforced on a developer's machine but not here, which is the wrong way round.
      - name: Unit tests (with coverage thresholds)
        run: npm run test:cov

      # The CI database starts empty, so the schema has to be created before the e2e suite can run.
      - name: Apply database migrations
        run: npm run migration:run

      - name: End-to-end tests
        run: npm run test:e2e

  # ── the mobile half ────────────────────────────────────────────────────────
  #
  # Added when the iOS and Android projects were merged into main. Until then CI covered the
  # backend only, so main could hold mobile code that nothing had built -- the app compiled on one
  # laptop and nowhere else, and a broken screen would have reached main unnoticed.
  #
  # This runs on every pull request rather than only when mobile/ changes. It costs a few minutes on
  # backend-only PRs, and it is the safer trade: a per-path filter combined with a required status
  # check is a well-known way to leave a pull request waiting forever for a job that will never run.
  mobile:
    name: Android build, unit tests & design conformance
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/welcome-screen

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # JDK 21: what AGP 8.9 and Gradle 8.11 are built against. The Android SDK itself is already
      # present on the runner image, and AGP downloads the API 36 platform if it is missing.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle distribution and the dependency cache between runs. Without it every run
      # re-downloads Compose, libphonenumber and the Android build tools from scratch.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository is developed on Windows, where the executable bit does not exist. It is set
      # in the index, and this is the belt to that pair of braces: if it is ever lost by a commit
      # from a Windows machine, CI still runs instead of failing with "permission denied".
      - name: Make the Gradle wrapper executable
        run: chmod +x android-preview-project/gradlew

      # assembleRelease as well as debug, deliberately. R8 only runs on release, and it removes
      # anything it cannot see being used -- which is how libphonenumber's country data nearly went
      # missing, in a build that a debug-only CI would have passed happily.
      - name: Build and test the Android app
        working-directory: mobile/welcome-screen/android-preview-project
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --no-daemon

      # The design conformance checkers. Pure Python, a couple of seconds, and the only automated
      # check the iOS half has at all -- there is no Mac here, so these read the Swift sources
      # rather than compiling them. They are why the two platforms have not silently diverged.
      - name: Design conformance and cross-platform parity
        run: |
          for f in verify-spec verify-welcome verify-connect check-country-data \
                   check-tutorial-routing check-swift-structure check-swift-arg-order \
                   check-ios-availability; do
            echo "── $f"
            python3 "audit/$f.py"
          done

      # Kept when the run fails, so a layout or conformance failure can be read without rerunning
      # anything locally -- which matters most for the iOS side, where nobody can reproduce it.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: mobile/welcome-screen/android-preview-project/app/build/reports/
          retention-days: 7
